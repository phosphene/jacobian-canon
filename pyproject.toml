[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaccanon"
version = "0.1.0"
description = "Canonical Jacobian Primitives, Historical Lineages, and Design for Testability (DFT)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Ed Phil" },
    { name = "Flow", email = "flow@phosphene.internal" },
]
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "sympy>=1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jaccanon", "src/phosphene"]
